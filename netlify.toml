# The site is prebuilt by `python tools/build.py`; Netlify only serves the folder.
[build]
  publish = "site"
  command = ""

# Digest files live under a content-hash folder, so a browser can keep them for good.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
